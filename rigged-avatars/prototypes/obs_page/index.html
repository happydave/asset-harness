<!DOCTYPE html>
<!--
  WI 1370 spike — does our own WebGL2 page reach a stream through OBS, webcam-driven?

  Route C (owner's choice 2026-09-07): OBS has no Browser Source on this machine, so the page is rendered
  in an ordinary browser and picked up with an OBS *Window Capture*. That answers everything the spike
  asks except transparency, which window capture cannot carry.

  The whole point of driving the VRM rather than a coloured triangle: MediaPipe FaceLandmarker emits the
  *same 52 ARKit blendshape names* our clips are called (WI 923's finding — Google ships the identical
  vocabulary under Apache-2.0). So the tracker->avatar mapping is an IDENTITY LOOKUP, and if it works,
  that is a live test of WI 1362's clip contract against a real tracker.

  Serve from the `rigged-avatars/` directory so the sample VRM is reachable:
      cd rigged-avatars && python3 -m http.server 8777
      → http://localhost:8777/prototypes/obs_page/
  localhost is a secure context, which getUserMedia requires; file:// will not work.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>WI 1370 — avatar / OBS pipeline spike</title>
<style>
  html, body { margin: 0; height: 100%; background: #101014; overflow: hidden;
               font: 13px/1.45 ui-monospace, "DejaVu Sans Mono", monospace; color: #cfd3dc; }
  /* A garish backdrop on purpose: with a transparent renderer this is what shows through, so the
     falsifiable alpha check is "do you see magenta where the avatar isn't". */
  #chroma { position: fixed; inset: 0; display: none; }   /* colour set from ?key= */
  #chroma.on { display: block; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; top: 10px; left: 10px; padding: 10px 14px; border-radius: 6px;
         background: rgba(8,8,12,.82); border: 1px solid #2b2f3a; white-space: pre; z-index: 5; }
  #hud b { color: #8fd0ff; font-weight: 600; }
  .bad  { color: #ff7a7a; }
  .good { color: #7ddc8a; }
  /* The latency loop: point the webcam at this clock. The captured frame shows an older value, and the
     difference IS the end-to-end camera->screen latency. Costs nothing and needs no instrumentation. */
  #clock { position: fixed; right: 14px; bottom: 12px; font-size: 46px; font-weight: 700;
           color: #fff; background: #000; padding: 4px 12px; letter-spacing: 2px; z-index: 5; }
  #copy { position: fixed; left: 10px; top: 10px; transform: translateY(-100%); margin-top: -4px;
           z-index: 7; font: inherit; font-size: 11px; color: #cfd3dc; cursor: pointer;
           background: #1b1f28; border: 1px solid #2b2f3a; border-radius: 5px; padding: 3px 9px; }
  #copy:hover { background: #262c38; }
  #copy.done { color: #7ddc8a; border-color: #3f6f4a; }
  #err { position: fixed; inset: auto 10px 10px 10px; padding: 10px 14px; border-radius: 6px;
         background: #3a1114; border: 1px solid #71232a; color: #ffb4b4; display: none;
         white-space: pre-wrap; z-index: 9; }
  video { display: none; }
  /* The tracker's own view. Answers "is it even seeing my eyebrows?" without guesswork. */
  #preview { position: fixed; right: 14px; top: 10px; width: 320px; height: 180px; z-index: 6;
             border: 1px solid #2b2f3a; border-radius: 6px; background: #000; transform: scaleX(-1); }
  #bars { position: fixed; right: 14px; top: 200px; width: 320px; z-index: 6; padding: 8px 10px;
          border-radius: 6px; background: rgba(8,8,12,.82); border: 1px solid #2b2f3a; }
  #bars div { display: flex; align-items: center; gap: 6px; margin: 1px 0; font-size: 11px; }
  #bars span.n { width: 132px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bars span.v { width: 30px; text-align: right; color: #9aa3b2; }
  #bars i { height: 7px; background: #4a9eff; border-radius: 2px; display: block; }
  #bars .stub i { background: #6b5330; }
  #preview.off, #bars.off { display: none; }
</style>
</head>
<body>
<div id="chroma"></div>
<canvas id="gl"></canvas>
<video id="cam" playsinline></video>
<div id="hud">starting…</div>
<button id="copy" title="copy a stats snapshot">copy stats</button>
<div id="clock">--</div>
<canvas id="preview" width="320" height="180"></canvas>
<div id="bars"></div>
<div id="err"></div>

<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRMLoaderPlugin, VRMUtils } from './vendor/three-vrm.module.js';
import { FilesetResolver, FaceLandmarker, DrawingUtils } from './vendor/mediapipe/vision_bundle.mjs';

const qs   = new URLSearchParams(location.search);
const VRM_URL = qs.get('vrm') ?? '../../findings/samples-2026-09-07-v1-face-rig/v1_face_rig.vrm';
// ?delegate=CPU falls back if WebGL-based inference misbehaves — Firefox is a less-trodden path for
// MediaPipe's GPU delegate than Chrome, and a one-URL change beats editing the file.
const DELEGATE = (qs.get('delegate') ?? 'GPU').toUpperCase();
// Head-pose axis signs: pitch +1, yaw -1, roll -1. Confirmed by the owner against the WI 1372-corrected
// asset, and the combination is not arbitrary -- it IS the left-right mirror a VTuber wants, which
// negates yaw and roll and leaves pitch alone.
//
// Pitch briefly defaulted to -1. That was a workaround for WI 1362's backwards-facing avatar leaking
// through, not a property of the tracker: correcting the facing removed the need for it and left yaw
// and roll untouched. Half the earlier hypothesis, measured rather than argued.
const SIGN = { pitch: +(qs.get('pitch') ?? 1), yaw: +(qs.get('yaw') ?? -1), roll: +(qs.get('roll') ?? -1) };
const SMOOTH = +(qs.get('smooth') ?? 0.5);   // 1 = no smoothing, lower = steadier but laggier
// ?key=00ff00 etc. Magenta needed ~218 similarity in OBS's Color Key; a different hue may key
// tighter, and a tight key matters because a loose one starts eating the avatar.
const KEY = qs.get('key') ?? 'ff00c8';
// Gaze pitch is +1, confirmed by the owner once the iris was actually visible. It was briefly flipped
// to -1 on an earlier report of "up/down backward" -- but that report was made while the eyeballs were
// solid blue with no iris, so the direction was not judgeable. Do not flip a default on a visual
// report about something that is not yet visible.
const GAZE = { yaw: +(qs.get('gazeyaw') ?? 1), pitch: +(qs.get('gazepitch') ?? 1),
               deg: +(qs.get('gazedeg') ?? 22) };
const hud = document.getElementById('hud');
const errBox = document.getElementById('err');
const fail = (where, e) => {
  // Attribute failures to a LAYER, which is one of the spike's acceptance criteria: "the failure is
  // attributed to a specific layer rather than to 'OBS'".
  errBox.style.display = 'block';
  errBox.textContent = `FAILED IN LAYER: ${where}\n${e?.stack || e}`;
  console.error(where, e);
};

// ---------------------------------------------------------------- renderer
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
const gl2 = renderer.getContext() instanceof WebGL2RenderingContext;
renderer.setClearAlpha(0);                       // transparent: route A/B would composite on this
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.05, 20);
scene.add(new THREE.DirectionalLight(0xffffff, 2.4).translateY(2).translateZ(3));
scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const resize = () => {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
};
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- the avatar
let vrm = null, headBone = null, eyeL = null, eyeR = null, expressionNames = new Set(), facingZ = 1;
// Mouse wheel = zoom, drag = orbit, right-drag = pan. Requested by the owner mid-run.
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 0.12; controls.maxDistance = 4.0;
try {
  const loader = new GLTFLoader();
  loader.register(p => new VRMLoaderPlugin(p));
  const gltf = await loader.loadAsync(VRM_URL);
  vrm = gltf.userData.vrm;
  if (!vrm) throw new Error(`${VRM_URL} loaded as plain glTF — no VRM extension found`);
  VRMUtils.rotateVRM0(vrm);                      // no-op on a 1.0 file; correct for a 0.x one
  scene.add(vrm.scene);
  headBone = vrm.humanoid?.getNormalizedBoneNode('head') ?? null;
  eyeL = vrm.humanoid?.getNormalizedBoneNode('leftEye') ?? null;
  eyeR = vrm.humanoid?.getNormalizedBoneNode('rightEye') ?? null;
  for (const n of Object.keys(vrm.expressionManager?.expressionMap ?? {})) expressionNames.add(n);
  // Frame the head, on whichever side the face actually IS.
  //
  // Read the facing off the eye bones rather than assuming it. WI 1362 shipped facing -Z where VRM 1.0
  // requires +Z; that is corrected in WI 1372, so a current asset reads +Z and the HUD says so. This is
  // kept as a GUARD, not a workaround: it costs one line and it is how the defect surfaced at all.
  const hb = vrm.humanoid?.getRawBoneNode('head');
  const eye = vrm.humanoid?.getRawBoneNode('leftEye');
  const y = hb ? hb.getWorldPosition(new THREE.Vector3()).y : 1.2;
  facingZ = eye ? Math.sign(eye.getWorldPosition(new THREE.Vector3()).z || 1) : 1;
  const target = new THREE.Vector3(0, y + 0.02, 0);
  camera.position.set(0, y + 0.02, 0.62 * facingZ);
  controls.target.copy(target);
  controls.update();
} catch (e) { fail('VRM LOAD (three-vrm)', e); }

// ---------------------------------------------------------------- tracker
const stats = {
  renderFrames: 0, trackFrames: 0, camFrames: 0, fps: 0, tfps: 0, cfps: 0,
  faceSeen: false, driven: 0, matched: 0, unmatched: new Set(),
  trackMs: 0, frameMs: 0,
};
// Running ranges, so the copy button reports what was actually seen rather than one instant.
const range = {};
const track = (k, v) => { const r = range[k] ??= [v, v]; if (v < r[0]) r[0] = v; if (v > r[1]) r[1] = v; };

let landmarker = null, camReady = false;
const video = document.getElementById('cam');

// Gate detection on a genuinely NEW camera frame. `video.currentTime` advances continuously, not in
// frame steps, so keying on it re-ran inference on the same image ~2x over and reported the result as
// "tracker fps" — a number that overstated useful work and burned GPU a game would want.
let frameDirty = false;
const HAS_RVFC = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
function onCamFrame() {
  frameDirty = true; stats.camFrames++;
  video.requestVideoFrameCallback(onCamFrame);
}
try {
  const fileset = await FilesetResolver.forVisionTasks('./vendor/mediapipe/wasm');
  landmarker = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: './vendor/face_landmarker.task', delegate: DELEGATE },
    runningMode: 'VIDEO',
    numFaces: 1,
    outputFaceBlendshapes: true,               // the ARKit-52 names — the identity mapping
    outputFacialTransformationMatrixes: true,  // head pose
  });
} catch (e) { fail('MEDIAPIPE INIT (wasm/model)', e); }

// ?device=N picks the Nth video input. The BRIO exposes TWO capture nodes — /dev/video0 is the RGB
// camera and /dev/video2 is an 8-bit greyscale IR sensor for face-auth — and nothing stops the browser
// defaulting to the wrong one.
let camLabel = '(unknown)';
try {
  const constraints = {
    // 720p30 deliberately: on the BRIO, YUYV at 1080p is bandwidth-starved, and face landmarks want
    // frame rate over resolution. Plain values are 'ideal', so a device that cannot do this still opens.
    video: { width: 1280, height: 720, frameRate: 30 }, audio: false,
  };
  const want = qs.get('device');
  if (want !== null) {
    // enumerateDevices only returns labels once permission exists, so take a throwaway stream first
    const probe = await navigator.mediaDevices.getUserMedia({ video: true });
    const inputs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    probe.getTracks().forEach(t => t.stop());
    const pick = inputs[Number(want)];
    if (!pick) throw new Error(`?device=${want} out of range; ${inputs.length} video inputs: ` +
                               inputs.map((d, i) => `[${i}] ${d.label}`).join(' '));
    constraints.video.deviceId = { exact: pick.deviceId };
  }
  video.srcObject = await navigator.mediaDevices.getUserMedia(constraints);
  camLabel = video.srcObject.getVideoTracks()[0]?.label ?? '(unlabelled)';
  await video.play(); camReady = true;
  if (HAS_RVFC) video.requestVideoFrameCallback(onCamFrame);
  else setInterval(() => { frameDirty = true; stats.camFrames++; }, 1000 / 60);  // coarse fallback
} catch (e) {
  // Translate the three getUserMedia failures that actually happen into what to DO about them. The
  // first one cost a session: V4L2 capture is effectively exclusive, and OBS holding the camera makes
  // Firefox fail here with a message that names neither OBS nor the camera.
  const hint = {
    NotReadableError:
      'Another process already holds the camera — V4L2 capture is effectively exclusive.\n' +
      'Most likely OBS: remove or deactivate its "Video Capture Device (V4L2)" source and reload.\n' +
      'Confirm with:  fuser -v /dev/video*\n' +
      '(Under route C, OBS should capture the browser WINDOW, not the camera.)',
    NotAllowedError:
      'Camera permission denied, or the page is not in a secure context.\n' +
      'Serve over http://localhost — file:// will not work.',
    NotFoundError:
      'No video input found. Check:  ls /dev/video*  and  v4l2-ctl --list-devices',
    OverconstrainedError:
      'The selected device cannot satisfy the constraints — likely the IR sensor (8-bit greyscale).\n' +
      'Try ?device=0 to pick the RGB camera explicitly.',
  }[e?.name];
  fail('WEBCAM (getUserMedia)', hint ? `${e.name}: ${e.message}\n\n${hint}` : e);
}

// ---------------------------------------------------------------- loop
let windowStart = performance.now();
const clockEl = document.getElementById('clock');
document.getElementById('chroma').style.background = '#' + KEY;
const pv = document.getElementById('preview'), pvx = pv.getContext('2d');
const barsEl = document.getElementById('bars');
const draw = new DrawingUtils(pvx);
// The 16 clips WI 1362 actually authored. Everything else in the 52 is a declared stub, so a high
// score on one of those means the TRACKER sees it and our avatar has nothing to move.
const BOUND = new Set(['eyeBlinkLeft','eyeBlinkRight','eyeWideLeft','eyeWideRight','eyeSquintLeft',
  'eyeSquintRight','browInnerUp','browDownLeft','browDownRight','jawOpen','mouthSmileLeft',
  'mouthSmileRight','mouthFrownLeft','mouthFrownRight','mouthFunnel','mouthPucker']);
let lastCats = [];
let lastGaze = null;   // what we SEND, as opposed to what the tracker sees

function driveFromBlendshapes(categories) {
  // IDENTITY MAPPING. MediaPipe's category names are the ARKit-52 vocabulary, which is exactly what
  // arkit52.py declares, so a name that fails to match here is a real contract defect, not a mapping gap.
  let matched = 0, driven = 0;
  for (const c of categories) {
    // `_neutral` is MediaPipe's own first category, not an ARKit blendshape — never expected to match.
    if (c.categoryName === '_neutral') continue;
    if (!expressionNames.has(c.categoryName)) { stats.unmatched.add(c.categoryName); continue; }
    matched++;
    vrm.expressionManager.setValue(c.categoryName, c.score);
    if (c.score > 0.02) driven++;
  }
  stats.matched = matched; stats.driven = driven;
}

const _e = new THREE.Euler(0, 0, 0, 'YXZ'), _q = new THREE.Quaternion(), _m = new THREE.Matrix4();
const _e2 = new THREE.Euler(0, 0, 0, 'YXZ'), _q2 = new THREE.Quaternion();

// WI 1362 made gaze bone-driven so the eight eyeLook* clips could be legitimate free stubs. That only
// pays off if something actually TURNS the eye bones — and nothing here did, so the irises sat dead
// ahead and read as shading. MediaPipe emits all eight scores, so drive the bones from them directly.
// This is the first test of whether 1362's gaze decision pays off against a real tracker.
function driveGaze(cats) {
  if (!eyeL || !eyeR) return;
  const g = n => cats.find(c => c.categoryName === n)?.score ?? 0;
  const MAX = GAZE.deg * Math.PI / 180;
  const g2 = {};
  for (const [bone, side] of [[eyeL, 'Left'], [eyeR, 'Right']]) {
    // "In" is toward the nose, so its screen direction depends on which eye it is.
    const horiz = (side === 'Left' ? 1 : -1) * (g('eyeLookIn' + side) - g('eyeLookOut' + side));
    const vert  = g('eyeLookDown' + side) - g('eyeLookUp' + side);
    _e2.set(vert * MAX * GAZE.pitch, horiz * MAX * GAZE.yaw, 0, 'YXZ');
    bone.quaternion.slerp(_q2.setFromEuler(_e2), SMOOTH);
    g2[side] = { h: horiz * GAZE.yaw, v: vert * GAZE.pitch };
  }
  lastGaze = g2;
}
function driveHeadPose(matrixes) {
  if (!headBone || !matrixes?.facialTransformationMatrixes?.length) return;
  _m.fromArray(matrixes.facialTransformationMatrixes[0].data);
  _q.setFromRotationMatrix(_m);
  // Decompose to named axes rather than negating quaternion components. Negating q.y/q.z happens to
  // mirror, but it gives no way to correct ONE axis -- and pitch was the one that came out backwards.
  // YXZ order = yaw, pitch, roll, which is how a head actually moves.
  _e.setFromQuaternion(_q, 'YXZ');
  _e.set(_e.x * SIGN.pitch, _e.y * SIGN.yaw, _e.z * SIGN.roll, 'YXZ');
  headBone.quaternion.slerp(_q.setFromEuler(_e), SMOOTH);
}

const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const t0 = performance.now();

  if (landmarker && camReady && video.readyState >= 2 && frameDirty) {
    frameDirty = false;
    const ts0 = performance.now();
    let res = null;
    try { res = landmarker.detectForVideo(video, ts0); }
    catch (e) { fail('MEDIAPIPE DETECT', e); landmarker = null; }
    stats.trackMs = performance.now() - ts0;
    stats.trackFrames++;
    const shapes = res?.faceBlendshapes?.[0]?.categories;
    stats.faceSeen = !!shapes;                 // <- the falsifiable check: cover the lens, this goes false
    if (shapes && vrm) { driveFromBlendshapes(shapes); driveHeadPose(res); driveGaze(shapes); }
    lastCats = shapes ?? [];
    if (!pv.classList.contains('off')) {
      pvx.save(); pvx.clearRect(0, 0, pv.width, pv.height);
      pvx.drawImage(video, 0, 0, pv.width, pv.height);
      const lm = res?.faceLandmarks?.[0];
      if (lm) {
        draw.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_TESSELATION, { color: '#2effa030', lineWidth: 0.4 });
        draw.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_CONTOURS,    { color: '#7ddc8a',   lineWidth: 1 });
        // brows highlighted: the owner asked whether they are being seen at all
        draw.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_LEFT_EYEBROW,  { color: '#ffcc00', lineWidth: 2.5 });
        draw.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_RIGHT_EYEBROW, { color: '#ffcc00', lineWidth: 2.5 });
        // what the tracker SEES of the eyes
        draw.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_LEFT_EYE,   { color: '#8fd0ff', lineWidth: 1.5 });
        draw.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE,  { color: '#8fd0ff', lineWidth: 1.5 });
        draw.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_LEFT_IRIS,  { color: '#00e5ff', lineWidth: 2 });
        draw.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_RIGHT_IRIS, { color: '#00e5ff', lineWidth: 2 });
      }
      pvx.restore();
      // ...and what we SEND: two eyes with the pupil offset by the rotation actually applied. The
      // preview is mirrored in CSS, so draw these after restore() and mirror the horizontal by hand,
      // or left and right read swapped against the face behind them.
      if (lastGaze) {
        const R = 13, cy = pv.height - 20;
        for (const [side, cx] of [['Left', pv.width - 46], ['Right', pv.width - 20]]) {
          const gz = lastGaze[side]; if (!gz) continue;
          pvx.save(); pvx.translate(cx, cy); pvx.scale(-1, 1);   // undo the CSS mirror for this widget
          pvx.beginPath(); pvx.arc(0, 0, R, 0, 6.284);
          pvx.fillStyle = '#f2f4f8'; pvx.fill();
          pvx.strokeStyle = '#2b2f3a'; pvx.lineWidth = 1; pvx.stroke();
          pvx.beginPath();
          pvx.arc(gz.h * R * 0.55, gz.v * R * 0.55, R * 0.42, 0, 6.284);
          pvx.fillStyle = '#17284d'; pvx.fill();
          pvx.restore();
        }
        pvx.fillStyle = '#9aa3b2'; pvx.font = '10px monospace'; pvx.textAlign = 'right';
        pvx.fillText('sent →', pv.width - 62, cy + 4);
      }
    }
  }

  controls.update();
  if (vrm) vrm.update(Math.min(clock.getDelta(), 1 / 30));
  renderer.render(scene, camera);
  stats.renderFrames++;
  stats.frameMs = performance.now() - t0;

  const now = performance.now();
  if (now - windowStart >= 1000) {
    const span = now - windowStart;
    stats.fps  = stats.renderFrames * 1000 / span;
    stats.tfps = stats.trackFrames  * 1000 / span;
    stats.cfps = stats.camFrames    * 1000 / span;
    stats.renderFrames = stats.trackFrames = stats.camFrames = 0; windowStart = now;
    track('render fps', stats.fps); track('camera fps', stats.cfps);
    track('detect/s', stats.tfps); track('ms/detect', stats.trackMs);
    // top scoring clips, with bound-vs-stub called out: separates "the tracker isn't seeing it" from
    // "our morph is too small", which is not a distinction you can make by looking at the avatar
    const top = [...lastCats].filter(c => c.categoryName !== '_neutral')
      .sort((a, b) => b.score - a.score).slice(0, 8);
    barsEl.innerHTML = top.map(c =>
      `<div class="${BOUND.has(c.categoryName) ? '' : 'stub'}"><span class="n">${c.categoryName}` +
      `${BOUND.has(c.categoryName) ? '' : ' *'}</span>` +
      `<i style="width:${Math.round(c.score * 120)}px"></i>` +
      `<span class="v">${c.score.toFixed(2)}</span></div>`).join('') +
      `<div style="opacity:.6;margin-top:4px">* = declared stub, nothing bound to move</div>`;
    const face = stats.faceSeen ? '<span class="good">YES</span>' : '<span class="bad">NO</span>';
    hud.innerHTML =
      `<b>WI 1370</b>  route C (window capture)   delegate=${DELEGATE}\n` +
      `camera     ${camLabel}\n` +
      `facing     ${facingZ > 0 ? '<span class="good">+Z (VRM 1.0 correct)</span>'
                                : '<span class="bad">-Z — BACKWARDS, WI 1362 defect; view compensated</span>'}\n` +
      `WebGL2     ${gl2 ? '<span class="good">yes</span>' : '<span class="bad">NO (WebGL1)</span>'}\n` +
      `render     ${stats.fps.toFixed(1)} fps   (${stats.frameMs.toFixed(1)} ms/frame)\n` +
      `camera     ${stats.cfps.toFixed(1)} fps delivered${HAS_RVFC ? '' : '  <span class="bad">(estimated — no rVFC)</span>'}\n` +
      `detect     ${stats.tfps.toFixed(1)}/s   (${stats.trackMs.toFixed(1)} ms each)\n` +
      `face       ${face}\n` +
      `clips      ${stats.matched} of 51 ARKit names matched the VRM\n` +
      `signal     ${stats.driven} receiving a non-zero score  (only 16 are bound;\n`  +
      `           the other 36 are declared stubs and will not visibly move)\n` +
      `unmatched  ${stats.unmatched.size ? '<span class="bad">' + [...stats.unmatched].slice(0,4).join(',') + '</span>' : '<span class="good">none</span>'}\n` +
      `keys       [c] key colour #${KEY}  [h] HUD  [r] reset  [v] tracker view\n` +
      `pose       pitch ${SIGN.pitch>0?'+':''}${SIGN.pitch} yaw ${SIGN.yaw>0?'+':''}${SIGN.yaw} roll ${SIGN.roll>0?'+':''}${SIGN.roll}  smooth ${SMOOTH}\n` +
      `gaze       ${eyeL && eyeR
          ? `pitch ${GAZE.pitch>0?'+':''}${GAZE.pitch} yaw ${GAZE.yaw>0?'+':''}${GAZE.yaw}  \u00b1${GAZE.deg}\u00b0`
          : '<span class="bad">no eye bones in this VRM</span>'}\n` +
      `mouse      wheel = zoom, drag = orbit, right-drag = pan`;
  }
  // ms clock for the camera-loop latency measurement
  clockEl.textContent = String(now.toFixed(0)).slice(-5);
}
frame();

// The HUD rewrites itself every second, which resets any text selection — so copying it by hand is
// impossible. Requested by the owner mid-run.
document.getElementById('copy').addEventListener('click', async ev => {
  const r = k => range[k] ? `${range[k][0].toFixed(1)}–${range[k][1].toFixed(1)}` : 'n/a';
  const text = [
    `WI 1370 route C — ${new Date().toISOString()}`,
    `page       ${location.href}`,
    `camera     ${camLabel}`,
    `facing     ${facingZ > 0 ? '+Z' : '-Z (WI 1362 defect, view compensated)'}`,
    `pose       pitch ${SIGN.pitch} yaw ${SIGN.yaw} roll ${SIGN.roll}  smooth ${SMOOTH}  delegate ${DELEGATE}`,
    ``,
    `render fps   ${r('render fps')}`,
    `camera fps   ${r('camera fps')}   ${HAS_RVFC ? '(measured per delivered frame)' : '(ESTIMATED — no requestVideoFrameCallback)'}`,
    `detections/s ${r('detect/s')}`,
    `ms/detect    ${r('ms/detect')}`,
    `clips        ${stats.matched} of 51 ARKit names matched`,
    `unmatched    ${stats.unmatched.size ? [...stats.unmatched].join(', ') : 'none'}`,
    ``,
    `top blendshapes at copy time:`,
    ...[...lastCats].filter(c => c.categoryName !== '_neutral')
        .sort((a, b) => b.score - a.score).slice(0, 8)
        .map(c => `  ${c.categoryName.padEnd(22)} ${c.score.toFixed(2)}` +
                  `${BOUND.has(c.categoryName) ? '' : '   (stub — nothing bound)'}`),
  ].join('\n');
  try { await navigator.clipboard.writeText(text); } catch { console.log(text); }
  ev.target.textContent = 'copied ✓'; ev.target.classList.add('done');
  setTimeout(() => { ev.target.textContent = 'copy stats'; ev.target.classList.remove('done'); }, 1500);
});

addEventListener('keydown', e => {
  if (e.key === 'c') document.getElementById('chroma').classList.toggle('on');
  if (e.key === 'v') { pv.classList.toggle('off'); barsEl.classList.toggle('off'); }
  if (e.key === 'h') { hud.style.display = hud.style.display === 'none' ? '' : 'none'; }
  if (e.key === 'r' && vrm) {
    const hb2 = vrm.humanoid?.getRawBoneNode('head');
    const y2 = hb2 ? hb2.getWorldPosition(new THREE.Vector3()).y : 1.2;
    camera.position.set(0, y2 + 0.02, 0.62 * facingZ);
    controls.target.set(0, y2 + 0.02, 0); controls.update();
  }
});
</script>
</body>
